[package]
name = "gallery-desktop-menzies"
version = "0.1.3"
description = "Menzies OS gallery desktop app"
authors = ["Mariesta"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
dirs = "6"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
base64 = "0.22"
arboard = { version = "3", features = ["image-data", "wayland-data-control"] }
ed25519-dalek = "2.1.1"
sha2 = "0.10"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2.3.1"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic"] }

[features]
default = ["face-runtime"]
face-runtime = ["dep:ort"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.12.0"

# Size-oriented release (see menzies-os rule 11-smallest-app-size)
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
