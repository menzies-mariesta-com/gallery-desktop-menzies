[package]
name = "gallery-desktop-menzies"
version = "0.1.2"
description = "Menzies OS gallery desktop app"
authors = ["Mariesta"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
dirs = "6"
thiserror = "2"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-process = "2.3.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.12.0"

# Size-oriented release (see menzies-os rule 11-smallest-app-size)
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
